<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bookstore{% endblock %}</title>
    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9;}
        .navbar {background:#333; color:#fff; padding:10px 20px; display:flex; align-items:center; justify-content:space-between;}
        .navbar a {color:#fff; margin-right:15px; text-decoration:none;}
        .search-box input {padding:5px; border:none; border-radius:3px;}
        .container {padding:20px;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="/">Home</a>
            <a href="#">Fiction</a>
            <a href="#">Non-Fiction</a>
            <a href="#">Science</a>
        </div>
        <div class="search-box">
            <form method="get" action="/search/">
                <input type="text" name="q" placeholder="Search books..." />
            </form>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
