<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bookstore{% endblock %}</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f9;
        }

        .navbar {
            background: #ffffff;
            color: #333;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-logo a {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111;
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-right: 30px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-left a:not(.nav-logo a) {
            color: #555;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-left a:hover:not(.nav-logo a) {
            color: #000;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 10px 15px 10px 35px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 0.9rem;
            width: 250px;
            background: #f9f9f9;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #999;
            background: #fff;
            width: 280px;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            width: 16px;
            height: 16px;
        }

        .cart-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s ease;
        }

        .cart-wrapper:hover {
            transform: scale(1.05);
        }

        .cart-icon {
            width: 24px;
            height: 24px;
        }

        .cart-counter {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 12px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-logo">
                <a href="/">Bookstore</a>
            </div>
            <a href="/explore/">Explore</a>
            <a href="/explore/?genre=ficiton">Fiction</a>
            <a href="/explore/?genre=non-fiction">Non-Fiction</a>
            <a href="/explore/?genre=self-help">Self Help</a>
        </div>


        <div class="nav-right">

            <div class="search-box">
                <form method="get" action="/explore/">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="q" placeholder="Search books..." />
                </form>
            </div>
            {% if request.user.is_authenticated %}
            <a href="{% url 'profile' %}"
                style="color: #555; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s;">Profile</a>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit"
                    style="color: #555; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; border: none; background: transparent; cursor: pointer;">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}"
                style="color: #555; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s;">Login</a>
            {% endif %}
            <a href="/cart/" class="cart-wrapper" aria-label="View Cart">
                <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-counter">0</span>
            </a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
<script>

    function cartCount() {
        fetch("/cart-count/")
            .then(res => res.json())
            .then(data => {
                document.querySelector(".cart-counter").textContent = data.count
            })

    }
    cartCount()
</script>

</html>
